name: Munib Android Release Validation Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/android-release-validation-temp.yml"
      - ".github/workflows/android-release.yml"
      - "android/app/build.gradle.kts"

permissions:
  contents: read

jobs:
  validate-release-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create temporary signing key
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/munib-ci-test.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storepass changeit \
            -keypass changeit \
            -alias munib-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Munib CI Test, OU=CI, O=Munib, L=Gaza, C=PS"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=munib-ci" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=changeit" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: flutter pub get

      - name: Build universal APK
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64

      - name: Build ABI-specific APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Verify all release outputs
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/*.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
