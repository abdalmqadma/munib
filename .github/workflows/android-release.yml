name: Munib Android Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: munib-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            RELEASE_TAG="$DISPATCH_TAG"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.1.0"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::pubspec version is $APP_VERSION but release tag is $RELEASE_TAG"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.release.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        if: steps.release.outputs.should_release == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.release.outputs.should_release == 'true'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        if: steps.release.outputs.should_release == 'true'
        run: flutter test

      - name: Validate Android signing secrets
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Prepare release keystore
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/munib-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build universal APK
        if: steps.release.outputs.should_release == 'true'
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64

      - name: Build ABI-specific APKs
        if: steps.release.outputs.should_release == 'true'
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Build Android App Bundle
        if: steps.release.outputs.should_release == 'true'
        run: flutter build appbundle --release

      - name: Package release files
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          mkdir -p dist

          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/munib-${TAG}-universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/munib-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/munib-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/munib-${TAG}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/munib-${TAG}.aab"

          (
            cd dist
            sha256sum *.apk *.aab > SHA256SUMS.txt
          )

          ls -lh dist

      - name: Upload build artifacts
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: munib-android-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Munib $RELEASE_TAG" \
            --generate-notes
