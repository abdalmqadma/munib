name: Munib Auth Email UX Check

on:
  push:
    branches:
      - feat/auth-email-ux
    paths:
      - ".github/workflows/auth-email-ux-ci.yml"
      - "tool/wire_auth_email_ux.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wire Auth email UX and validate web handlers
        run: python3 tool/wire_auth_email_ux.py

      - name: Commit Auth email wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth_screen.dart lib/presentation/screens/forgot_password_screen.dart website/reset-password/index.html
          git diff --cached --check
          git commit -m "feat: align Auth emails with app locale"
          git push origin HEAD:feat/auth-email-ux

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
