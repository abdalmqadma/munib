name: Munib Code Checks

on:
  push:
    branches: [feat/firebase-analytics]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  preserve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore existing lock and add Analytics entries only
        shell: bash
        run: |
          git checkout origin/main -- pubspec.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.lock')
          text = path.read_text()
          marker = '  firebase_auth:\n'
          analytics = '''  firebase_analytics:\n    dependency: "direct main"\n    description:\n      name: firebase_analytics\n      sha256: "4f85b161772e1d54a66893ef131c0a44bd9e552efa78b33d5f4f60d2caa5c8a3"\n      url: "https://pub.dev"\n    source: hosted\n    version: "11.6.0"\n  firebase_analytics_platform_interface:\n    dependency: transitive\n    description:\n      name: firebase_analytics_platform_interface\n      sha256: a44b6d1155ed5cae7641e3de7163111cfd9f6f6c954ca916dc6a3bdfa86bf845\n      url: "https://pub.dev"\n    source: hosted\n    version: "4.4.3"\n  firebase_analytics_web:\n    dependency: transitive\n    description:\n      name: firebase_analytics_web\n      sha256: c7d1ed1f86ae64215757518af5576ff88341c8ce5741988c05cc3b2e07b0b273\n      url: "https://pub.dev"\n    source: hosted\n    version: "0.5.10+16"\n'''
          if '  firebase_analytics:\n' not in text:
              if marker not in text:
                  raise SystemExit('firebase_auth marker not found')
              text = text.replace(marker, analytics + marker, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: preserve lockfile and add Analytics only"
          git push
