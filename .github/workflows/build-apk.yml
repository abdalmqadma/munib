name: Munib Code Checks

on:
  push:
    branches: [feat/fcm-push-notifications]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Print Firebase Messaging lock entries
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path('pubspec.lock').read_text().splitlines()
          targets = {
              'firebase_messaging',
              'firebase_messaging_platform_interface',
              'firebase_messaging_web',
          }
          i = 0
          while i < len(lines):
              match = re.match(r'^  ([a-zA-Z0-9_]+):$', lines[i])
              if match and match.group(1) in targets:
                  start = i
                  i += 1
                  while i < len(lines) and not re.match(
                      r'^  [a-zA-Z0-9_]+:$', lines[i]
                  ):
                      i += 1
                  print('\n'.join(lines[start:i]))
                  print('---')
                  continue
              i += 1
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
