name: Munib Code Checks

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "website/**"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase test dependencies
        run: npm ci --ignore-scripts

      - name: Test web Auth handlers and Firestore rules
        run: npm run test:firebase

      - name: Remove Node test workspace before Flutter checks
        run: rm -rf node_modules

      - name: Set up Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
