name: Munib FCM Lockfile Update

on:
  push:
    branches: [feat/fcm-push-notifications]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Firebase Messaging lock entries only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.lock')
          text = path.read_text()
          marker = '  firebase_storage:\n'
          messaging = '''  firebase_messaging:\n    dependency: "direct main"\n    description:\n      name: firebase_messaging\n      sha256: "60be38574f8b5658e2f22b7e311ff2064bea835c248424a383783464e8e02fcc"\n      url: "https://pub.dev"\n    source: hosted\n    version: "15.2.10"\n  firebase_messaging_platform_interface:\n    dependency: transitive\n    description:\n      name: firebase_messaging_platform_interface\n      sha256: "685e1771b3d1f9c8502771ccc9f91485b376ffe16d553533f335b9183ea99754"\n      url: "https://pub.dev"\n    source: hosted\n    version: "4.6.10"\n  firebase_messaging_web:\n    dependency: transitive\n    description:\n      name: firebase_messaging_web\n      sha256: "0d1be17bc89ed3ff5001789c92df678b2e963a51b6fa2bdb467532cc9dbed390"\n      url: "https://pub.dev"\n    source: hosted\n    version: "3.10.10"\n'''
          if '  firebase_messaging:\n' not in text:
              if marker not in text:
                  raise SystemExit('firebase_storage marker not found')
              text = text.replace(marker, messaging + marker, 1)
              path.write_text(text)
          PY

          if git diff --quiet -- pubspec.lock; then
            echo "Messaging entries already present"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: lock Firebase Messaging dependencies"
          git push
