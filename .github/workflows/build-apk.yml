name: Munib Change Password Check

on:
  push:
    branches: [feat/change-password]
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire profile password action
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/screens/profile_screen.dart')
          text = path.read_text()

          old_import = "import 'auth_screen.dart';\nimport 'home_screen.dart';"
          new_import = "import 'auth_screen.dart';\nimport 'change_password_screen.dart';\nimport 'home_screen.dart';"
          if text.count(old_import) != 1:
              raise SystemExit('profile import anchor not found exactly once')
          text = text.replace(old_import, new_import, 1)

          old_provider_logic = """            final provider = authProviderLabel(
              user.providerData.map((item) => item.providerId),
              isArabic: _isArabic,
            );
"""
          new_provider_logic = old_provider_logic + """            final hasPasswordProvider = _auth.isPasswordUser(user);
            final isGoogleOnly =
                !hasPasswordProvider && _auth.isGoogleUser(user);
"""
          if text.count(old_provider_logic) != 1:
              raise SystemExit('profile provider logic anchor not found exactly once')
          text = text.replace(old_provider_logic, new_provider_logic, 1)

          old_security_ui = """                _InfoTile(
                  icon: Icons.login_rounded,
                  title: t('طريقة تسجيل الدخول', 'Sign-in method'),
                  value: provider,
                ),
                const SizedBox(height: 28),
"""
          new_security_ui = """                _InfoTile(
                  icon: Icons.login_rounded,
                  title: t('طريقة تسجيل الدخول', 'Sign-in method'),
                  value: provider,
                ),
                const SizedBox(height: 12),
                if (hasPasswordProvider)
                  OutlinedButton.icon(
                    onPressed: () async {
                      final changed = await Navigator.push<bool>(
                        context,
                        MaterialPageRoute(
                          builder: (_) => ChangePasswordScreen(user: user),
                        ),
                      );
                      if (changed == true && context.mounted) {
                        ScaffoldMessenger.of(context).showSnackBar(
                          SnackBar(
                            content: Text(
                              t(
                                'تم تغيير كلمة المرور بنجاح.',
                                'Password changed successfully.',
                              ),
                            ),
                          ),
                        );
                      }
                    },
                    icon: const Icon(Icons.lock_reset_rounded),
                    label: Text(
                      t('تغيير كلمة المرور', 'Change password'),
                    ),
                  )
                else if (isGoogleOnly)
                  _InfoTile(
                    icon: Icons.lock_outline_rounded,
                    title: t('كلمة المرور', 'Password'),
                    value: t(
                      'تُدار كلمة المرور بواسطة Google',
                      'Password is managed by Google',
                    ),
                  ),
                const SizedBox(height: 28),
"""
          if text.count(old_security_ui) != 1:
              raise SystemExit('profile security UI anchor not found exactly once')
          text = text.replace(old_security_ui, new_security_ui, 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/profile_screen.dart
          git diff --cached --check
          git commit -m "feat: add change password action to profile"
          git push origin HEAD:feat/change-password

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
