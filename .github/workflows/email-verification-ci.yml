name: Munib Email Verification Check

on:
  push:
    branches:
      - feat/email-verification-web
    paths:
      - ".github/workflows/email-verification-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire verification screen
        run: python3 tool/wire_email_verification.py

      - name: Commit auth wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth_screen.dart
          git diff --cached --check
          git commit -m "feat: wire email verification cooldown flow"
          git push origin HEAD:feat/email-verification-web

      - name: Validate web handler and iOS plist
        shell: bash
        run: python3 -c "from pathlib import Path; import plistlib; html=Path('website/verify-email/index.html').read_text(); assert all(x in html for x in ['verifyEmail','oobCode','accounts:update','munib://verified','فتح منيب']); p=plistlib.load(open('ios/Runner/Info.plist','rb')); assert 'munib' in [s for i in p.get('CFBundleURLTypes',[]) for s in i.get('CFBundleURLSchemes',[])]"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
