name: Munib Feedback Fast Commit

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/feedback-commit-fast.yml"

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Apply feedback patch
        run: python3 .github/scripts/patch_feedback_polish.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/data/services/feedback_service.dart \
            lib/main.dart \
            lib/presentation/screens/home_screen.dart \
            lib/presentation/screens/settings_screen.dart \
            test/feedback_service_test.dart
          git commit -m "feat: add feedback prompt and simplify home"
          git push origin HEAD:feat/lock-screen-prayer-widget
