name: Munib Feedback Polish Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/scripts/patch_feedback_polish.py"
      - ".github/workflows/feedback-polish-temp.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Apply feedback patch
        run: python3 .github/scripts/patch_feedback_polish.py

      - name: Validate source markers
        run: |
          grep -q "FeedbackService.registerAppLaunch" lib/main.dart
          grep -q "ساعدنا في تحسين التطبيق" lib/presentation/screens/settings_screen.dart
          grep -q "FeedbackService.shouldShowPrompt" lib/presentation/screens/home_screen.dart
          grep -q "1FAIpQLSflyBX884jBVdxUxJ-rB2GHWHHLi70klOraudF2dK9EJrN6dg" lib/data/services/feedback_service.dart
          if grep -q "_NextPrayerSummary" lib/presentation/screens/home_screen.dart; then
            echo "Duplicate next-prayer summary still exists"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Increase Gradle heap for CI
        run: |
          cp android/gradle.properties /tmp/munib-gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          text = path.read_text()
          text = text.replace('-Xmx2048m', '-Xmx6144m')
          path.write_text(text)
          PY

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Restore CI-only Gradle memory change
        if: always()
        run: cp /tmp/munib-gradle.properties android/gradle.properties

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/data/services/feedback_service.dart \
            lib/main.dart \
            lib/presentation/screens/home_screen.dart \
            lib/presentation/screens/settings_screen.dart \
            test/feedback_service_test.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add feedback prompt and simplify home"
          git push origin HEAD:feat/lock-screen-prayer-widget
