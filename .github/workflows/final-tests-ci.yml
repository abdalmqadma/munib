name: Munib Final Test Suite

on:
  push:
    branches:
      - feat/final-tests
    paths:
      - ".github/workflows/final-tests-ci.yml"
      - "lib/**"
      - "test/**"
      - "website/**"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Firebase test dependencies
        run: npm install --ignore-scripts

      - name: Commit package lock when generated
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "test: lock Firebase emulator dependencies"
            git push origin HEAD:feat/final-tests
          fi

      - name: Test web Auth handlers and Firestore rules
        run: npm run test:firebase

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
