name: Munib Forgot Password Check

on:
  push:
    branches:
      - feat/forgot-password
    paths:
      - ".github/workflows/forgot-password-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire forgot password action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/screens/auth_screen.dart')
          text = path.read_text()

          old_import = "import '../../data/services/auth_service.dart';\nimport 'home_screen.dart';"
          new_import = "import '../../data/services/auth_service.dart';\nimport 'forgot_password_screen.dart';\nimport 'home_screen.dart';"
          if text.count(old_import) != 1:
              raise SystemExit('auth import anchor not found exactly once')
          text = text.replace(old_import, new_import, 1)

          anchor = """                    if (!isLogin) ...[
                      const SizedBox(height: 16),
                      TextFormField(
                        controller: _confirmController,
"""
          replacement = """                    if (isLogin)
                      Align(
                        alignment: AlignmentDirectional.centerEnd,
                        child: TextButton(
                          onPressed: isLoading
                              ? null
                              : () => Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (_) => ForgotPasswordScreen(
                                        initialEmail: _emailController.text,
                                      ),
                                    ),
                                  ),
                          child: Text(
                            Localizations.localeOf(context).languageCode == 'ar'
                                ? 'نسيت كلمة المرور؟'
                                : 'Forgot password?',
                          ),
                        ),
                      ),
                    if (!isLogin) ...[
                      const SizedBox(height: 16),
                      TextFormField(
                        controller: _confirmController,
"""
          if text.count(anchor) != 1:
              raise SystemExit('forgot password UI anchor not found exactly once')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY

      - name: Commit auth screen wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth_screen.dart
          git diff --cached --check
          git commit -m "feat: add forgot password link to sign in"
          git push origin HEAD:feat/forgot-password

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
