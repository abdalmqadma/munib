name: Munib Mini Website Check

on:
  push:
    branches:
      - feat/mini-website-hosting
    paths:
      - ".github/workflows/mini-website-ci.yml"
      - "tool/check_mini_website.py"
      - "website/**"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML, links, JavaScript and Firebase config
        run: python3 tool/check_mini_website.py

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Smoke test Hosting routes
        shell: bash
        run: |
          firebase emulators:exec --only hosting --project munib-f5102 --config firebase.json 'bash -c '\''set -e; for path in / /verify-email /reset-password /privacy /terms; do code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:5000${path}"); echo "$path -> $code"; test "$code" = "200"; done; code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/not-a-real-page); echo "/not-a-real-page -> $code"; test "$code" = "404"'\'''
