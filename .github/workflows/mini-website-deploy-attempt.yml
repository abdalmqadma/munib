name: Munib Hosting Deploy Attempt

on:
  push:
    branches:
      - feat/mini-website-hosting
    paths:
      - ".github/workflows/mini-website-deploy-attempt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUNIB_F5102 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Select Firebase credential
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "No Firebase deployment credential is configured in this repository." >&2
            exit 20
          fi

      - name: Deploy Hosting
        shell: bash
        run: |
          if [ "$FIREBASE_AUTH_MODE" = "service-account" ]; then
            firebase deploy --only hosting --project munib-f5102 --non-interactive
          else
            firebase deploy --only hosting --project munib-f5102 --token "$FIREBASE_TOKEN" --non-interactive
          fi
