name: Nafahat Delete Target Style Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/nafahat-delete-style-temp.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Patch delete target style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt')
          s = p.read_text()
          old = '''                setColor(
                    if (dark) Color.argb(191, 145, 35, 45)
                    else Color.argb(191, 180, 45, 55),
                )
                setStroke(dp(2), Color.rgb(214, 218, 224))'''
          new = '''                setColor(Color.argb(217, 128, 128, 128))
                setStroke(dp(2), Color.rgb(70, 70, 70))'''
          if old not in s:
              raise SystemExit('Delete target style marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Validate exact style
        run: |
          grep -q "Color.argb(217, 128, 128, 128)" android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          grep -q "Color.rgb(70, 70, 70)" android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Android Kotlin
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
        run: ./gradlew app:compileDebugKotlin --no-daemon

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          git commit -m "style: refine Nafahat delete target"
          git push origin HEAD:feat/lock-screen-prayer-widget
