name: Nafahat Delete Target Style Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/nafahat-delete-style-temp.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Patch delete target style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt')
          s = p.read_text()
          markers = [
              'Color.argb(191, 145, 35, 45)',
              'Color.argb(191, 180, 45, 55)',
              'Color.rgb(214, 218, 224)',
          ]
          if not all(m in s for m in markers):
              raise SystemExit('Delete target color markers not found')
          s = s.replace('Color.argb(191, 145, 35, 45)', 'Color.argb(217, 128, 128, 128)', 1)
          s = s.replace('Color.argb(191, 180, 45, 55)', 'Color.argb(217, 128, 128, 128)', 1)
          s = s.replace('Color.rgb(214, 218, 224)', 'Color.rgb(70, 70, 70)', 1)
          p.write_text(s)
          PY

      - name: Validate exact style
        run: |
          test "$(grep -c 'Color.argb(217, 128, 128, 128)' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt)" -ge 2
          grep -q "Color.rgb(70, 70, 70)" android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Android Kotlin
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
        run: ./gradlew app:compileDebugKotlin --no-daemon

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          git commit -m "style: refine Nafahat delete target"
          git push origin HEAD:feat/lock-screen-prayer-widget
