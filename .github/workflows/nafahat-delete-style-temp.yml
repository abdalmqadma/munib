name: Nafahat Delete Target Repair Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/nafahat-delete-style-temp.yml"

permissions:
  contents: write

jobs:
  repair-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Restore last known-good Nafahat service
        run: |
          git show ee74d15:android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt > android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt

      - name: Apply requested delete target style only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt')
          s = p.read_text(encoding='utf-8')
          required = [
              'setTextColor(Color.WHITE)',
              'Color.argb(191, 145, 35, 45)',
              'Color.argb(191, 180, 45, 55)',
              'Color.rgb(214, 218, 224)',
          ]
          if not all(x in s for x in required):
              raise SystemExit('Known-good delete target markers not found')
          s = s.replace('setTextColor(Color.WHITE)', 'setTextColor(Color.rgb(70, 70, 70))', 1)
          s = s.replace('Color.argb(191, 145, 35, 45)', 'Color.argb(217, 160, 160, 160)', 1)
          s = s.replace('Color.argb(191, 180, 45, 55)', 'Color.argb(217, 160, 160, 160)', 1)
          s = s.replace('Color.rgb(214, 218, 224)', 'Color.rgb(80, 80, 80)', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate requested style
        run: |
          test "$(grep -c 'Color.argb(217, 160, 160, 160)' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt)" -eq 2
          grep -q 'setTextColor(Color.rgb(70, 70, 70))' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          grep -q 'setStroke(dp(2), Color.rgb(80, 80, 80))' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          ! grep -q 'content.title' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          ! grep -q 'content.body' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          ! grep -q 'performClick()' android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Android release Kotlin
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
        run: ./gradlew app:compileReleaseKotlin --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/kotlin/com/example/munib/NafahatBubbleService.kt
          git commit -m "fix: restore Nafahat service and refine delete target"
          git push origin HEAD:feat/lock-screen-prayer-widget
