name: Munib Splash Theme Validation Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/workflows/splash-theme-validation-temp.yml"
      - "lib/presentation/screens/splash_screen.dart"
      - "assets/muneeb_icons/munib_splash_dark.png.b64"
      - "assets/muneeb_icons/munib_splash_light.png.b64"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug
