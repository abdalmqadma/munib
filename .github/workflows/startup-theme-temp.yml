name: Munib Startup Theme Temp

on:
  push:
    branches: [feat/lock-screen-prayer-widget]
    paths:
      - ".github/scripts/patch_startup_theme.py"
      - ".github/workflows/startup-theme-temp.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lock-screen-prayer-widget
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_startup_theme.py

      - name: Validate source markers
        run: |
          grep -q "ic_launcher_foreground.png" lib/presentation/screens/splash_screen.dart
          grep -q "PlatformDispatcher.instance.locale.languageCode" lib/presentation/providers/prayer_provider.dart
          grep -q "saveThemePreference" lib/features/prayer_times/data/widget_service.dart
          grep -q "widget_theme_preference" android/app/src/main/kotlin/com/example/munib/PrayerWidgetScheduler.kt
          grep -q "themePreference" ios/PrayerWidgetExtension/PrayerWidget.swift

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/presentation/screens/splash_screen.dart \
            lib/presentation/providers/prayer_provider.dart \
            lib/main.dart \
            lib/features/settings/presentation/theme_provider.dart \
            lib/features/prayer_times/data/widget_service.dart \
            pubspec.yaml \
            android/app/src/main/kotlin/com/example/munib/PrayerWidgetScheduler.kt \
            android/app/src/main/res/drawable/widget_light_background.xml \
            android/app/src/main/res/drawable/widget_light_panel.xml \
            android/app/src/main/res/drawable/widget_prayer_icon_circle_light.xml \
            ios/PrayerWidgetExtension/PrayerWidget.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: sync startup language and widget theme"
          git push origin HEAD:feat/lock-screen-prayer-widget
