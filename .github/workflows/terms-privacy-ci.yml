name: Munib Terms Privacy Check

on:
  push:
    branches:
      - feat/terms-privacy
    paths:
      - ".github/workflows/terms-privacy-ci.yml"
      - "tool/wire_terms_privacy.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire terms and privacy
        run: python3 tool/wire_terms_privacy.py

      - name: Commit legal wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth_screen.dart lib/presentation/screens/settings_screen.dart
          git diff --cached --check
          git commit -m "feat: require terms and privacy consent"
          git push origin HEAD:feat/terms-privacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android Kotlin
        working-directory: android
        run: >-
          gradle :app:compileDebugKotlin --stacktrace
          -Ptarget-platform=android-arm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
