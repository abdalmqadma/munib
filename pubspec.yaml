name: munib
description: "Imsakiah AI Prayer App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  provider: ^6.1.2
  intl: ^0.19.0
  home_widget: ^0.9.3
  path_provider: ^2.1.4
  flutter_spinkit: ^5.2.1
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_generative_ai: ^0.4.5
  lottie: ^3.1.0
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.14.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/muneeb_icons/store/playstore_512.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/muneeb_icons/store/playstore_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
